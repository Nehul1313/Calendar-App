<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Calendar</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #3c4043;
            --card-bg: #ffffff;
            --primary: #1a73e8;
            --primary-hover: #174ea6;
            --border: #dadce0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 500;
            color: #5f6368;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #globalSidebarToggle {
            background: transparent;
            border: none;
            color: #5f6368;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.5rem;
        }
        #globalSidebarToggle:hover {
            background-color: #f1f3f4;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
        }

        .container {
            flex: 1;
            padding: 0;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .glass-panel {
            background: var(--card-bg);
            padding: 1.5rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <h1>
            <button id="globalSidebarToggle" title="Toggle Sidebar" style="background:#f1f3f4; border:1px solid #dadce0; border-radius:4px; padding:4px 8px; font-size:1.25rem; color:#3c4043; cursor:pointer; margin-right:8px;">☰</button>
            Collaborative Calendar
        </h1>
        <div class="user-info">
            {% if user.is_authenticated %}
                <span>Welcome, <strong>{{ user.username }}</strong></span>
                <a href="{% url 'export_ics' %}?calendar_id={{ selected_calendar.id }}" class="btn" style="background: white; color: var(--primary); border: 1px solid var(--border);">Export .ics</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn">Login</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
