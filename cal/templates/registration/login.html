{% extends 'base.html' %}

{% block content %}
<div class="glass-panel" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="margin-top: 0; text-align: center;">Login</h2>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label for="id_username" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Username:</label>
            <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="id_password" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Password:</label>
            <input type="password" name="password" autocomplete="current-password" required id="id_password" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; box-sizing: border-box;">
        </div>
        {% if form.errors %}
            <p style="color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem;">Your username and password didn't match. Please try again.</p>
        {% endif %}
        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem;">Login</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
{% endblock %}
