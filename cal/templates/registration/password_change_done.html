{% extends 'base.html' %}

{% block content %}
<div style="display: flex; flex: 1; align-items: center; justify-content: center; background-color: #f8fafc; min-height: calc(100vh - 65px);">
    <div style="background: #fff; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); text-align: center;">
        <h2 style="margin: 0; font-size: 1.75rem; color: #3c4043; font-weight: 600; margin-bottom: 1rem;">Password Changed Successfully</h2>
        <p style="color: #5f6368; font-size: 0.95rem; margin-bottom: 2rem;">Your password has been successfully updated.</p>
        
        <a href="{% url 'calendar' %}" class="btn" style="padding: 0.875rem 1.5rem; font-size: 1rem; border-radius: 6px; font-weight: 600; text-decoration: none; display: inline-block;">Return to Calendar</a>
    </div>
</div>
{% endblock %}
